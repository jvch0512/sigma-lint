title: Whoami Execution
id: 4a5b6c7d-1e2f-4a3b-9c8d-0e1f2a3b4c5d
status: test
description: Detects execution of whoami.exe, often used for discovery after initial access.
author: Example Team
date: 2026/11/01
tags:
  - attack.discovery
  - attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\whoami.exe'
  filter_system:
    User|contains: 'SYSTEM'
  condition: selection and not filter_system
falsepositives:
  - Administrators running diagnostics
level: low
