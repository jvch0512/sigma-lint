title: Suspicious PowerShell Download
id: not-a-uuid
status: prod
author: Example Team
tags:
  - attack.t10599
logsource:
  product: windows
detection:
  selection_cmd:
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
  selection_any:
    - '*'
  unused_filter:
    ParentImage|endswith: '\explorer.exe'
  condition: selection_cmd and selection_img
level: severe
